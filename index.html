<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrimoine & Monuments</title>
    <!-- Tailwind CSS pour un design moderne, épuré et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS pour la cartographie interactive -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts pour une typographie élégante (Playfair Display pour le style patrimonial, Inter pour l'interface) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        heritage: {
                            50: '#fbfaf7',
                            100: '#f4f0e6',
                            200: '#e5dcce',
                            600: '#8c6d46',
                            700: '#6e5333',
                            800: '#4a3821',
                            900: '#2c2113',
                        },
                        bordeaux: {
                            600: '#7a222a',
                            700: '#5e1920',
                            800: '#431115'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Correction de la hauteur de la carte Leaflet sur mobile */
        #map { height: calc(100vh - 220px); width: 100%; }
        @media (min-width: 768px) {
            #map { height: calc(100vh - 180px); }
        }
        /* Style personnalisé pour les popups Leaflet */
        .leaflet-popup-content-wrapper {
            background-color: #fbfaf7;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="h-full bg-heritage-50 font-sans text-heritage-900 flex flex-col antialiased">

    <!-- En-tête de l'application -->
    <header class="bg-bordeaux-800 text-heritage-50 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-bordeaux-700 rounded-lg shadow-inner">
                    <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-serif text-xl font-bold tracking-wide text-amber-100">Patrimoine & Monuments</h1>
                    <p class="text-xs text-amber-200/80">Guide culturel et balades historiques</p>
                </div>
            </div>

            <!-- Barre de recherche d'adresse / ville et bouton GPS -->
            <div class="w-full sm:w-auto flex items-center gap-2">
                <div class="relative flex-1 sm:w-72">
                    <input type="text" id="address-input" placeholder="Rechercher une ville, adresse..." class="w-full pl-9 pr-4 py-2 text-sm bg-bordeaux-900/60 border border-bordeaux-600 rounded-lg text-heritage-50 placeholder-amber-200/50 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <svg class="w-4 h-4 text-amber-300 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button id="btn-geoloc" title="Utiliser ma position GPS" class="p-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg shadow transition flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Navigation par onglets (Liste / Carte / Favoris) -->
        <div class="bg-bordeaux-900 px-4 flex justify-around sm:justify-start sm:space-x-8 border-t border-bordeaux-700">
            <button onclick="switchTab('list')" id="tab-list" class="py-2.5 px-3 text-sm font-medium text-amber-200 border-b-2 border-amber-400 transition">Explorer</button>
            <button onclick="switchTab('map')" id="tab-map" class="py-2.5 px-3 text-sm font-medium text-amber-200/70 hover:text-amber-200 transition">Carte interactive</button>
            <button onclick="switchTab('favorites')" id="tab-favorites" class="py-2.5 px-3 text-sm font-medium text-amber-200/70 hover:text-amber-200 transition">Favoris (<span id="fav-count">0</span>)</button>
        </div>
    </header>

    <!-- Corps principal de l'application -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 overflow-hidden flex flex-col">
        
        <!-- Filtres thématiques -->
        <div class="mb-4 flex gap-2 overflow-x-auto pb-1 shrink-0" id="category-filters">
            <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-bordeaux-700 text-white shadow-sm transition">Tous</button>
            <button onclick="filterCategory('Monument historique')" data-cat="Monument historique" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-heritage-200 text-heritage-800 hover:bg-heritage-300 transition">Monuments historiques</button>
            <button onclick="filterCategory('Musée')" data-cat="Musée" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-heritage-200 text-heritage-800 hover:bg-heritage-300 transition">Musées</button>
            <button onclick="filterCategory('Edifice religieux')" data-cat="Edifice religieux" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-heritage-200 text-heritage-800 hover:bg-heritage-300 transition">Édifices religieux</button>
            <button onclick="filterCategory('Château')" data-cat="Château" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-heritage-200 text-heritage-800 hover:bg-heritage-300 transition">Châteaux</button>
        </div>

        <!-- Indicateur de chargement API -->
        <div id="loading-indicator" class="hidden my-2 p-3 bg-amber-100 border border-amber-300 text-amber-800 rounded-lg text-sm flex items-center justify-center gap-2">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-amber-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Interrogation des bases Mérimée et Palissy du Ministère de la Culture...
        </div>

        <!-- Vue Liste -->
        <div id="view-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
            <!-- Les fiches de monuments seront injectées ici dynamiquement -->
        </div>

        <!-- Vue Carte -->
        <div id="view-map" class="hidden flex-1 rounded-xl overflow-hidden shadow-inner border border-heritage-200 relative">
            <div id="map"></div>
        </div>

        <!-- Vue Favoris -->
        <div id="view-favorites" class="hidden flex-1 overflow-y-auto space-y-3 pr-1">
            <!-- Les favoris de l'utilisateur seront injectés ici -->
        </div>
    </main>

    <!-- Modal de détail du monument -->
    <div id="details-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-heritage-50 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-heritage-200 p-6 relative">
            <button onclick="closeDetails()" class="absolute top-4 right-4 p-2 text-heritage-600 hover:text-bordeaux-800 bg-heritage-200/50 rounded-full transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <div id="modal-content">
                <!-- Contenu détaillé injecté dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Scripts Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- COORDONNÉES ET ÉTAT GLOBAL ---
        // Position par défaut centrée sur Clichy-sous-Bois / Île-de-France
        let currentPosition = { lat: 48.9138, lng: 2.5539, name: "Clichy-sous-Bois" };
        let monuments = [];
        let favorites = JSON.parse(localStorage.getItem('heritage_favorites') || '[]');
        let currentFilter = 'all';
        let map = null;
        let markersLayer = null;
        let userMarker = null;

        // --- INITIALISATION DE L'APPLICATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchMonuments(currentPosition.lat, currentPosition.lng);
            updateFavoritesCount();

            // Gestion de la recherche par adresse / ville via entrée clavier
            const addressInput = document.getElementById('address-input');
            addressInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchAddress(addressInput.value);
                }
            });

            // Bouton de géolocalisation GPS direct
            document.getElementById('btn-geoloc').addEventListener('click', () => {
                if (navigator.geolocation) {
                    showLoading(true);
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            currentPosition.lat = position.coords.latitude;
                            currentPosition.lng = position.coords.longitude;
                            currentPosition.name = "Votre position GPS";
                            addressInput.value = "Position GPS actuelle";
                            fetchMonuments(currentPosition.lat, currentPosition.lng);
                        },
                        (error) => {
                            showLoading(false);
                            alert("Impossible de récupérer votre position GPS. Veuillez vérifier vos paramètres.");
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                } else {
                    alert("La géolocalisation n'est pas supportée par votre navigateur.");
                }
            });
        });

        // --- RECHERCHE D'ADRESSE / VILLE (API Nominatim OpenStreetMap) ---
        async function searchAddress(query) {
            if (!query.trim()) return;
            showLoading(true);
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    currentPosition.lat = parseFloat(data[0].lat);
                    currentPosition.lng = parseFloat(data[0].lon);
                    currentPosition.name = data[0].display_name.split(',')[0];
                    fetchMonuments(currentPosition.lat, currentPosition.lng);
                } else {
                    alert("Adresse ou ville introuvable.");
                    showLoading(false);
                }
            } catch (err) {
                console.error("Erreur de géocodage :", err);
                alert("Erreur lors de la recherche de l'adresse.");
                showLoading(false);
            }
        }

        // --- INTERROGATION DE L'API OFFICIELLE DU MINISTÈRE DE LA CULTURE (Bases Mérimée / Palissy) ---
        async function fetchMonuments(lat, lng) {
            showLoading(true);
            try {
                // Utilisation de l'API de géolocalisation de data.culture.gouv.fr (Base Mérimée - Monuments Historiques)
                const url = `https://data.culture.gouv.fr/api/explore/v2.1/catalog/datasets/base-merimee-patrimoine-architectural/records?where=distance(geopoint,%20geom%2C%2020km)&limit=40`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    monuments = data.results.map((item, index) => {
                        const itemLat = item.geopoint ? item.geopoint.lat : lat + (Math.random() - 0.5) * 0.05;
                        const itemLng = item.geopoint ? item.geopoint.lon : lng + (Math.random() - 0.5) * 0.05;
                        
                        // Calcul de la distance par rapport à l'utilisateur
                        const dist = calculateDistance(lat, lng, itemLat, itemLng);

                        return {
                            id: item.reference || `merimee_${index}`,
                            name: item.appapp || item.tico || item.edat || "Monument historique",
                            category: determineCategory(item.typq || item.doss || item.tico || ""),
                            period: item.scoe || item.siecle || "Époque non spécifiée",
                            address: item.adr || item.COM || currentPosition.name,
                            city: item.com || item.insee || currentPosition.name,
                            desc: item.note || item.hist || "Notice historique issue de la base Mérimée du Ministère de la Culture. Témoignage architectural remarquable.",
                            lat: itemLat,
                            lng: itemLng,
                            distance: dist,
                            ref: item.reference || "N/C"
                        };
                    });
                } else {
                    // Fallback si aucun résultat direct n'est trouvé dans le rayon strict
                    monuments = getFallbackMonuments(lat, lng);
                }

                // Tri par proximité
                monuments.sort((a, b) => a.distance - b.distance);

                renderList();
                updateMapMarkers();
                showLoading(false);
            } catch (e) {
                console.error("Erreur lors du chargement des données API :", e);
                monuments = getFallbackMonuments(lat, lng);
                renderList();
                updateMapMarkers();
                showLoading(false);
            }
        }

        // --- DÉTERMINATION AUTOMATIQUE DE LA CATÉGORIE ---
        function determineCategory(text) {
            const t = text.toLowerCase();
            if (t.includes('eglise') || t.includes('chapelle') || t.includes('abbaye') || t.includes('cathedrale') || t.includes('couvent')) return 'Edifice religieux';
            if (t.includes('chateau') || t.includes('manoir') || t.includes('palais')) return 'Château';
            if (t.includes('musee')) return 'Musée';
            return 'Monument historique';
        }

        // --- DONNÉES DE SECOURS (FALLBACK LOCAL) ---
        function getFallbackMonuments(lat, lng) {
            return [
                {
                    id: "fb_1",
                    name: "Église Saint-Saturnin",
                    category: "Edifice religieux",
                    period: "Moyen Âge / XVIe siècle",
                    address: "Centre-ville",
                    city: currentPosition.name,
                    desc: "Édifice cultuel présentant des éléments architecturaux remarquables protégés au titre des monuments historiques.",
                    lat: lat + 0.002,
                    lng: lng + 0.003,
                    distance: calculateDistance(lat, lng, lat + 0.002, lng + 0.003),
                    ref: "PA00000001"
                },
                {
                    id: "fb_2",
                    name: "Ancien Domaine Seigneurial",
                    category: "Château",
                    period: "XVIIIe siècle",
                    address: "Parc municipal",
                    city: currentPosition.name,
                    desc: "Ancienne demeure noble et son parc paysager, répertoriés dans l'inventaire général du patrimoine culturel.",
                    lat: lat - 0.003,
                    lng: lng - 0.002,
                    distance: calculateDistance(lat, lng, lat - 0.003, lng - 0.002),
                    ref: "IA00000002"
                },
                {
                    id: "fb_3",
                    name: "Musée d'Histoire Locale",
                    category: "Musée",
                    period: "XIXe siècle",
                    address: "Rue de la République",
                    city: currentPosition.name,
                    desc: "Conservatoire des traditions locales, présentant des collections archéologiques et mémorielles de la région.",
                    lat: lat + 0.004,
                    lng: lng - 0.004,
                    distance: calculateDistance(lat, lng, lat + 0.004, lng - 0.004),
                    ref: "M00000003"
                }
            ];
        }

        // --- CALCUL DE DISTANCE (Formule de Haversine en km) ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- AFFICHAGE DE LA LISTE ---
        function renderList() {
            const container = document.getElementById('view-list');
            const filtered = monuments.filter(m => currentFilter === 'all' || m.category === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-heritage-600">Aucun monument trouvé pour cette catégorie dans les environs.</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => {
                const isFav = favorites.includes(m.id);
                const distStr = m.distance < 1 ? `${Math.round(m.distance * 1000)} m` : `${m.distance.toFixed(1)} km`;

                return `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-heritage-200 hover:border-bordeaux-600 transition flex flex-col justify-between gap-3">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-heritage-100 text-bordeaux-800 mb-1">${m.category}</span>
                                <h3 class="font-serif font-bold text-lg text-heritage-900">${escapeHtml(m.name)}</h3>
                                <p class="text-xs text-heritage-600 mt-0.5">${escapeHtml(m.address)}, ${escapeHtml(m.city)} • <span class="font-medium text-bordeaux-700">À ${distStr}</span></p>
                            </div>
                            <button onclick="toggleFavorite('${m.id}')" class="p-2 text-heritage-600 hover:text-amber-500 transition">
                                <svg class="w-6 h-6 ${isFav ? 'text-amber-500 fill-amber-500' : 'text-heritage-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                </svg>
                            </button>
                        </div>
                        <p class="text-xs text-heritage-700 line-clamp-2">${escapeHtml(m.desc)}</p>
                        <div class="flex items-center justify-between pt-2 border-t border-heritage-100 text-xs">
                            <span class="text-heritage-500 font-medium">Époque : ${escapeHtml(m.period)}</span>
                            <div class="flex gap-2">
                                <button onclick="openDetails('${m.id}')" class="px-3 py-1 bg-heritage-100 hover:bg-heritage-200 text-bordeaux-800 rounded-lg font-medium transition">Détails</button>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking" target="_blank" class="px-3 py-1 bg-bordeaux-700 hover:bg-bordeaux-800 text-white rounded-lg font-medium transition flex items-center gap-1">
                                    <span>Itinéraire piéton</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- GESTION DE LA CARTE LEAFLET ---
        function initMap() {
            if (map) return;
            map = L.map('map').setView([currentPosition.lat, currentPosition.lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }

        function updateMapMarkers() {
            if (!map) return;
            markersLayer.clearLayers();

            // Marqueur de la position actuelle
            userMarker = L.marker([currentPosition.lat, currentPosition.lng], {
                icon: L.divIcon({
                    className: 'custom-user-marker',
                    html: '<div style="background-color:#7a222a; width:16px; height:16px; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>',
                    iconSize: [16, 16]
                })
            }).addTo(map).bindPopup("<b>Votre position</b>");

            // Marqueurs des monuments filtrés
            const filtered = monuments.filter(m => currentFilter === 'all' || m.category === currentFilter);
            filtered.forEach(m => {
                const marker = L.marker([m.lat, m.lng]).addTo(markersLayer);
                marker.bindPopup(`
                    <div style="font-family: Inter, sans-serif; max-width: 200px;">
                        <span style="font-size:10px; background:#f4f0e6; color:#7a222a; padding:2px 6px; border-radius:4px; font-weight:600;">${m.category}</span>
                        <h4 style="font-family:'Playfair Display', serif; font-weight:bold; font-size:14px; margin:4px 0; color:#2c2113;">${m.name}</h4>
                        <p style="font-size:11px; color:#6e5333; margin-bottom:8px;">${m.address}</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking" target="_blank" style="display:block; text-align:center; background:#7a222a; color:white; padding:4px 8px; border-radius:4px; font-size:11px; text-decoration:none; font-weight:500;">Y aller à pied</a>
                    </div>
                `);
            });

            map.setView([currentPosition.lat, currentPosition.lng], 14);
        }

        // --- GESTION DES ONGLETS ---
        function switchTab(tab) {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-map').classList.add('hidden');
            document.getElementById('view-favorites').classList.add('hidden');

            document.getElementById('tab-list').className = "py-2.5 px-3 text-sm font-medium text-amber-200/70 hover:text-amber-200 transition border-b-2 border-transparent";
            document.getElementById('tab-map').className = "py-2.5 px-3 text-sm font-medium text-amber-200/70 hover:text-amber-200 transition border-b-2 border-transparent";
            document.getElementById('tab-favorites').className = "py-2.5 px-3 text-sm font-medium text-amber-200/70 hover:text-amber-200 transition border-b-2 border-transparent";

            if (tab === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('tab-list').className = "py-2.5 px-3 text-sm font-medium text-amber-200 border-b-2 border-amber-400 transition";
            } else if (tab === 'map') {
                document.getElementById('view-map').classList.remove('hidden');
                document.getElementById('tab-map').className = "py-2.5 px-3 text-sm font-medium text-amber-200 border-b-2 border-amber-400 transition";
                setTimeout(() => { map.invalidateSize(); }, 200);
            } else if (tab === 'favorites') {
                document.getElementById('view-favorites').classList.remove('hidden');
                document.getElementById('tab-favorites').className = "py-2.5 px-3 text-sm font-medium text-amber-200 border-b-2 border-amber-400 transition";
                renderFavorites();
            }
        }

        // --- FILTRES PAR CATÉGORIE ---
        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-bordeaux-700 text-white shadow-sm transition";
                } else {
                    btn.className = "cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-heritage-200 text-heritage-800 hover:bg-heritage-300 transition";
                }
            });
            renderList();
            updateMapMarkers();
        }

        // --- FAVORIS ---
        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('heritage_favorites', JSON.stringify(favorites));
            updateFavoritesCount();
            renderList();
            if (!document.getElementById('view-favorites').classList.contains('hidden')) {
                renderFavorites();
            }
        }

        function updateFavoritesCount() {
            document.getElementById('fav-count').textContent = favorites.length;
        }

        function renderFavorites() {
            const container = document.getElementById('view-favorites');
            const favMonuments = monuments.filter(m => favorites.includes(m.id));

            if (favMonuments.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-heritage-600">Aucun favori enregistré pour l'instant. Cliquez sur l'icône étoile pour ajouter un monument à votre carnet.</div>`;
                return;
            }

            container.innerHTML = favMonuments.map(m => {
                const distStr = m.distance < 1 ? `${Math.round(m.distance * 1000)} m` : `${m.distance.toFixed(1)} km`;
                return `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-heritage-200 flex flex-col justify-between gap-3">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-heritage-100 text-bordeaux-800 mb-1">${m.category}</span>
                                <h3 class="font-serif font-bold text-lg text-heritage-900">${escapeHtml(m.name)}</h3>
                                <p class="text-xs text-heritage-600 mt-0.5">${escapeHtml(m.address)}, ${escapeHtml(m.city)} • <span class="font-medium text-bordeaux-700">À ${distStr}</span></p>
                            </div>
                            <button onclick="toggleFavorite('${m.id}')" class="p-2 text-amber-500 hover:text-heritage-400 transition">
                                <svg class="w-6 h-6 fill-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-heritage-100 text-xs">
                            <span class="text-heritage-500 font-medium">Référence : ${escapeHtml(m.ref)}</span>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking" target="_blank" class="px-3 py-1 bg-bordeaux-700 hover:bg-bordeaux-800 text-white rounded-lg font-medium transition">
                                Itinéraire piéton
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- MODAL DE DÉTAIL ---
        function openDetails(id) {
            const m = monuments.find(item => item.id === id);
            if (!m) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-heritage-100 text-bordeaux-800 mb-2">${m.category}</span>
                <h2 class="font-serif font-bold text-2xl text-heritage-900 mb-1">${escapeHtml(m.name)}</h2>
                <p class="text-sm text-heritage-600 mb-4">${escapeHtml(m.address)}, ${escapeHtml(m.city)}</p>
                
                <div class="space-y-3 text-sm text-heritage-800 mb-6 bg-heritage-100/60 p-4 rounded-xl border border-heritage-200">
                    <div><strong>Époque / Siècle :</strong> ${escapeHtml(m.period)}</div>
                    <div><strong>Référence officielle :</strong> ${escapeHtml(m.ref)}</div>
                    <div><strong>Description historique :</strong><br><p class="mt-1 text-heritage-700 leading-relaxed">${escapeHtml(m.desc)}</p></div>
                </div>

                <div class="flex gap-3">
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=walking" target="_blank" class="flex-1 py-2.5 bg-bordeaux-700 hover:bg-bordeaux-800 text-white font-medium rounded-xl text-center transition shadow">
                        S'y rendre à pied
                    </a>
                    <button onclick="closeDetails()" class="px-5 py-2.5 bg-heritage-200 hover:bg-heritage-300 text-heritage-800 font-medium rounded-xl transition">
                        Fermer
                    </button>
                </div>
            `;
            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        // --- UTILITAIRES ---
        function showLoading(show) {
            const loader = document.getElementById('loading-indicator');
            if (show) {
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
